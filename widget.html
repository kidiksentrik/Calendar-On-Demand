<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calendar-On-Demand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="widget-container">
        <div class="bg-overlay"></div>
        <header>

            <div class="header-left">
                <h2 id="current-month-year">March 2026</h2>
                <div class="nav-btns">
                    <button id="prev-month">&lt;</button>
                    <button id="home-btn" title="Go to Today">🏠</button>
                    <button id="next-month">&gt;</button>
                </div>
            </div>
            <div class="header-right">
                <button id="lock-btn" class="icon-btn" title="Lock/Unlock Position" style="opacity: 0.6; font-size: 0.9rem !important;">📌</button>
                <button id="sync-btn" class="icon-btn" title="Sync Now">🔄</button>
                <button id="settings-toggle" class="icon-btn" title="Settings">⚙️</button>
            </div>
        </header>

        <!-- Settings Overlay -->
        <div id="settings-overlay" class="modal hidden">
            <div class="modal-content">
                <h3>Settings</h3>
                
                <div class="setting-group">
                    <h4>Behavior</h4>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Launch on startup</span>
                            <input type="checkbox" id="startup-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Always on Top</span>
                            <input type="checkbox" id="always-on-top-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Lock Position</span>
                            <input type="checkbox" id="lock-position-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Stick to Desktop</span>
                            <input type="checkbox" id="desktop-mode-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Sound Effects</span>
                            <input type="checkbox" id="sound-enabled-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>Start of Week</label>
                        <select id="start-of-week-select">
                            <option value="0">Sunday</option>
                            <option value="1">Monday</option>
                        </select>
                    </div>
                </div>

                <div class="setting-group">
                    <h4>Accounts</h4>
                    <div id="accounts-list">
                        <!-- Populated by JS -->
                    </div>
                    <button id="add-account-btn" style="width:100%; margin-top:8px; border-color: var(--accent-color); color: var(--accent-color);">+ Add Account</button>
                </div>

                <div class="setting-group">
                    <h4>Calendars</h4>
                    <div id="calendars-list" class="calendars-list">
                        <div style="font-size: 0.85rem; opacity: 0.5;">Loading calendars...</div>
                    </div>
                </div>

                <div class="setting-group">
                    <h4>Appearance</h4>
                    <div class="setting-item row">
                        <label>Background</label>
                        <input type="color" id="bg-color-picker" value="#0f0f14">
                    </div>
                    <div class="setting-item">
                        <label>Opacity</label>
                        <input type="range" id="opacity-slider" min="0.1" max="1.0" step="0.05" value="0.92">
                    </div>
                    <div class="setting-item row">
                        <label>Text Color</label>
                        <input type="color" id="text-color-picker" value="#e8e8e8">
                    </div>
                    <div class="setting-item row">
                        <label>Accent Color</label>
                        <input type="color" id="accent-color-picker" value="#4f8ef7">
                    </div>
                    <div class="setting-item row">
                        <label>Today Highlight</label>
                        <input type="color" id="today-color-picker" value="#ffcc00">
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="close-settings">Done</button>
                    <button id="reset-settings">Reset to defaults</button>
                </div>
                <div id="settings-app-version" class="app-version">v0.0.0</div>
            </div>
        </div>


        <div class="calendar-grid-header">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        
        <div id="calendar-days" class="calendar-grid">
            <!-- Days injected here -->
        </div>

        <div id="sync-indicator" class="sync-indicator hidden">Syncing...</div>
        <div id="update-indicator" class="update-indicator hidden">Update Available</div>
        
        <!-- Quick Add (Todo List) Modal -->
        <div id="quick-add-modal" class="modal hidden">
            <div class="modal-content todo-modal">
                <div class="todo-header">
                    <h3 id="todo-date-title">Date</h3>
                </div>
                
                <!-- Todo list container -->
                <div id="todo-list-container" class="todo-list">
                    <!-- Todo items will be dynamically injected here -->
                </div>

                <!-- Input area for adding a new todo -->
                <div class="todo-input-row">
                    <input type="text" id="quick-add-input" placeholder="Add a new task (e.g. Team Sync)...">
                    <button id="save-event" class="primary-btn">+</button>
                </div>

                <!-- Time selector row (All-day toggle + Time Pickers) -->
                <div class="todo-time-row">
                    <label class="time-toggle-label" title="Toggle all-day event">
                        <input type="checkbox" id="all-day-check">
                        <span class="custom-pill">All-day</span>
                    </label>
                    <div class="time-inputs-container" id="time-inputs-container">
                        <input type="time" id="event-start-time" class="time-picker-input" title="Start Time">
                        <span class="time-sep">~</span>
                        <input type="time" id="event-end-time" class="time-picker-input" title="End Time">
                    </div>
                </div>

                <div id="extra-fields">
                    <input type="text" id="event-location" placeholder="Location (optional)">
                    <textarea id="event-description" placeholder="Description (optional)"></textarea>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Mark as Important</span>
                            <input type="checkbox" id="important-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Highlight Day Cell</span>
                            <input type="checkbox" id="highlight-cell-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>Entry Color</label>
                        <div class="color-category-label">VIBRANT</div>
                        <div class="color-presets">
                            <button class="color-opt" data-color="default" style="background: #444; color: #444;"></button>
                            <button class="color-opt" data-color="#f44336" style="background: #f44336; color: #f44336;"></button>
                            <button class="color-opt" data-color="#ffeb3b" style="background: #ffeb3b; color: #ffeb3b;"></button>
                            <button class="color-opt" data-color="#4caf50" style="background: #4caf50; color: #4caf50;"></button>
                            <button class="color-opt" data-color="#2196f3" style="background: #2196f3; color: #2196f3;"></button>
                            <button class="color-opt" data-color="#9c27b0" style="background: #9c27b0; color: #9c27b0;"></button>
                        </div>
                        <div class="color-category-label">PASTEL</div>
                        <div class="color-presets">
                            <button class="color-opt" data-color="#ff9e99" style="background: #ff9e99; color: #ff9e99;"></button>
                            <button class="color-opt" data-color="#ffc77d" style="background: #ffc77d; color: #ffc77d;"></button>
                            <button class="color-opt" data-color="#fff59d" style="background: #fff59d; color: #fff59d;"></button>
                            <button class="color-opt" data-color="#a5d6a7" style="background: #a5d6a7; color: #a5d6a7;"></button>
                            <button class="color-opt" data-color="#80cbc4" style="background: #80cbc4; color: #80cbc4;"></button>
                            <button class="color-opt" data-color="#90caf9" style="background: #90caf9; color: #90caf9;"></button>
                            <button class="color-opt" data-color="#9fa8da" style="background: #9fa8da; color: #9fa8da;"></button>
                            <button class="color-opt" data-color="#ce93d8" style="background: #ce93d8; color: #ce93d8;"></button>
                            <button class="color-opt" data-color="#f48fb1" style="background: #f48fb1; color: #f48fb1;"></button>
                            <button class="color-opt" data-color="#bcaaa4" style="background: #bcaaa4; color: #bcaaa4;"></button>
                        </div>
                        <input type="hidden" id="selected-entry-color" value="default">
                    </div>
                </div>
                <div class="modal-actions" style="margin-top: 10px;">
                    <span class="hint">Esc to close</span>
                </div>
            </div>
        </div>

    </div>
    <script src="widget.js"></script>
</body>
</html>
