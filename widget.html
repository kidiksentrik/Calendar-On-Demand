<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calendar-On-Demand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="widget-container">
        <div class="bg-overlay"></div>
        <header>

            <div class="header-left">
                <h2 id="current-month-year">March 2026</h2>
                <div class="nav-btns">
                    <button id="prev-month" title="Previous Month">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <button id="home-btn" title="Go to Today">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="3.5" ry="3.5"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><circle cx="12" cy="15.5" r="2.2" fill="currentColor"/></svg>
                    </button>
                    <button id="next-month" title="Next Month">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
            <div class="header-right">
                <button id="view-toggle-btn" class="icon-btn" title="Switch to Week view (W)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="3"/><path d="M9 3v18"/><path d="M15 3v18"/><rect x="9.75" y="7" width="4.5" height="5" rx="1" fill="currentColor" fill-opacity="0.35" stroke="none"/></svg>
                </button>
                <button id="lock-btn" class="icon-btn" title="Lock/Unlock Position">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
                </button>
                <button id="sync-btn" class="icon-btn" title="Sync Now">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M21 21v-5h-5"/></svg>
                </button>
                <button id="settings-toggle" class="icon-btn" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3" fill="currentColor" fill-opacity="0.1"/></svg>
                </button>
            </div>
        </header>

        <!-- Settings Overlay -->
        <div id="settings-overlay" class="modal hidden">
            <div class="modal-content">
                <div class="settings-header">
                    <h3>Settings</h3>
                    <a class="kofi-header-btn" href="#" onclick="require('electron').shell.openExternal('https://ko-fi.com/kidiksentrik'); return false;" title="If this helped, consider supporting ☕"><span class="kofi-hover-text">support</span>☕</a>
                </div>
                
                <div class="setting-group">
                    <h4>Behavior</h4>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Launch on startup</span>
                            <input type="checkbox" id="startup-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Always on Top</span>
                            <input type="checkbox" id="always-on-top-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Lock Position</span>
                            <input type="checkbox" id="lock-position-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Stick to Desktop</span>
                            <input type="checkbox" id="desktop-mode-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Sound Effects</span>
                            <input type="checkbox" id="sound-enabled-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Event Notifications</span>
                            <input type="checkbox" id="notifications-enabled-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item notify-before-row" id="notify-before-row">
                        <label>Notify before</label>
                        <div class="pill-group" id="notify-minutes-group">
                            <button class="pill-btn" data-value="5">5m</button>
                            <button class="pill-btn" data-value="10">10m</button>
                            <button class="pill-btn active" data-value="15">15m</button>
                            <button class="pill-btn" data-value="30">30m</button>
                        </div>
                        <div class="notif-hint" id="notif-hint">⚠ Requires OS notifications to be enabled in System Settings</div>
                    </div>
                    <div class="setting-item">
                        <label>Start of Week</label>
                        <select id="start-of-week-select">
                            <option value="0">Sunday</option>
                            <option value="1">Monday</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Default View</label>
                        <select id="default-view-select">
                            <option value="month">Month</option>
                            <option value="week">Week</option>
                        </select>
                    </div>
                </div>

                <div class="setting-group">
                    <h4>Accounts</h4>
                    <div id="accounts-list">
                        <!-- Populated by JS -->
                    </div>
                    <button id="add-account-btn" class="add-account-btn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Add Account</span>
                    </button>
                </div>

                <div class="setting-group">
                    <h4>Calendars</h4>
                    <div id="calendars-list" class="calendars-list">
                        <div style="font-size: 0.85rem; opacity: 0.5;">Loading calendars...</div>
                    </div>
                </div>

                <div class="setting-group">
                    <h4>Appearance</h4>
                    <div class="setting-item row">
                        <label>Background</label>
                        <input type="color" id="bg-color-picker" value="#0f0f14">
                    </div>
                    <div class="setting-item">
                        <label>Opacity</label>
                        <input type="range" id="opacity-slider" min="0.1" max="1.0" step="0.05" value="0.92">
                    </div>
                    <div class="setting-item row">
                        <label>Text Color</label>
                        <input type="color" id="text-color-picker" value="#e8e8e8">
                    </div>
                    <div class="setting-item row">
                        <label>Accent Color</label>
                        <input type="color" id="accent-color-picker" value="#4f8ef7">
                    </div>
                    <div class="setting-item row">
                        <label>Today Highlight</label>
                        <input type="color" id="today-color-picker" value="#ffcc00">
                    </div>
                    <div class="setting-item">
                        <label>Event Time Style</label>
                        <select id="time-style-select">
                            <option value="badge">Micro time on top (10:00 ~ 11:00)</option>
                            <option value="start-only">Start time only (10:00)</option>
                            <option value="duration">Compact duration (10:00 (1h))</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="close-settings">Done</button>
                    <button id="reset-settings">Reset to defaults</button>
                </div>
                <div id="settings-app-version" class="app-version">v0.0.0</div>
            </div>
        </div>


        <!-- Month View Container -->
        <div id="month-view-container" class="month-view-container">
            <div class="calendar-grid-header">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            
            <div id="calendar-days" class="calendar-grid">
                <!-- Days injected here -->
            </div>
        </div>

        <!-- Week Timeline View Container -->
        <div id="week-view-container" class="week-timeline-container hidden">
            <!-- Week Header (Day names & numbers) -->
            <div class="week-header-row" id="week-header-row"></div>
            
            <!-- All-day Row -->
            <div class="week-allday-row" id="week-allday-row"></div>

            <!-- Scrollable Hourly Timeline Area -->
            <div class="week-scroll-container" id="week-scroll-container">
                <div class="week-grid-body" id="week-grid-body">
                    <div class="week-time-gutter" id="week-time-gutter"></div>
                    <div class="week-days-columns" id="week-days-columns"></div>
                </div>
            </div>
        </div>

        <div id="sync-indicator" class="sync-indicator hidden">Syncing...</div>
        <div id="update-indicator" class="update-indicator hidden">Update Available</div>
        
        <!-- Quick Add (Todo List) Modal -->
        <div id="quick-add-modal" class="modal hidden">
            <div class="modal-content todo-modal">
                <div class="todo-header">
                    <h3 id="todo-date-title">Date</h3>
                </div>
                
                <!-- Todo list container -->
                <div id="todo-list-container" class="todo-list">
                    <!-- Todo items will be dynamically injected here -->
                </div>

                <!-- Input area for adding a new todo -->
                <div class="todo-input-row">
                    <input type="text" id="quick-add-input" placeholder="Add a new task (e.g. Team Sync)...">
                    <button id="save-event" class="primary-btn">+</button>
                </div>

                <!-- DateTime group: Date row and Time row -->
                <div class="todo-datetime-group">
                    <!-- Date selector row (Always visible right below input) -->
                    <div class="todo-date-row">
                        <span class="row-label-pill">Date</span>
                        <div class="date-inputs-container" id="date-inputs-container">
                            <input type="date" id="event-start-date" class="date-picker-input" title="Start Date">
                            <span class="time-sep">~</span>
                            <input type="date" id="event-end-date" class="date-picker-input" title="End Date">
                        </div>
                    </div>

                    <!-- Time selector row (All-day toggle + Time Pickers) -->
                    <div class="todo-time-row">
                        <label class="time-toggle-label" title="Toggle all-day event">
                            <input type="checkbox" id="all-day-check">
                            <span class="custom-pill">All-day</span>
                        </label>
                        <div class="time-inputs-container" id="time-inputs-container">
                            <input type="time" id="event-start-time" class="time-picker-input" title="Start Time">
                            <span class="time-sep">~</span>
                            <input type="time" id="event-end-time" class="time-picker-input" title="End Time">
                        </div>
                        <span class="allday-status-text hidden" id="allday-status-text">All-day Event</span>
                    </div>
                </div>

                <div id="extra-fields">
                    <input type="text" id="event-location" placeholder="Location (optional)">
                    <textarea id="event-description" placeholder="Description (optional)"></textarea>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Mark as Important</span>
                            <input type="checkbox" id="important-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <span>Highlight Day Cell</span>
                            <input type="checkbox" id="highlight-cell-check">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label style="margin-bottom: 0;">Entry Color</label>
                            <button type="button" class="color-opt-default active" id="default-color-btn" data-color="default" data-color-id="default" title="Default (Calendar Color)">Default</button>
                        </div>
                        <div class="color-presets-24">
                            <!-- Row 1 (12 colors) -->
                            <button type="button" class="color-opt" data-color="#d50000" data-color-id="11" title="Tomato" style="background: #d50000; color: #d50000;"></button>
                            <button type="button" class="color-opt" data-color="#e67c73" data-color-id="4" title="Flamingo" style="background: #e67c73; color: #e67c73;"></button>
                            <button type="button" class="color-opt" data-color="#f4511e" data-color-id="6" title="Tangerine" style="background: #f4511e; color: #f4511e;"></button>
                            <button type="button" class="color-opt" data-color="#ef6c00" data-color-id="6" title="Pumpkin" style="background: #ef6c00; color: #ef6c00;"></button>
                            <button type="button" class="color-opt" data-color="#f09300" data-color-id="6" title="Orange" style="background: #f09300; color: #f09300;"></button>
                            <button type="button" class="color-opt" data-color="#f6bf26" data-color-id="5" title="Banana" style="background: #f6bf26; color: #f6bf26;"></button>
                            <button type="button" class="color-opt" data-color="#e4c441" data-color-id="5" title="Lemon" style="background: #e4c441; color: #e4c441;"></button>
                            <button type="button" class="color-opt" data-color="#c0ca33" data-color-id="2" title="Avocado" style="background: #c0ca33; color: #c0ca33;"></button>
                            <button type="button" class="color-opt" data-color="#7cb342" data-color-id="2" title="Pistachio" style="background: #7cb342; color: #7cb342;"></button>
                            <button type="button" class="color-opt" data-color="#0b8043" data-color-id="10" title="Basil" style="background: #0b8043; color: #0b8043;"></button>
                            <button type="button" class="color-opt" data-color="#33b679" data-color-id="2" title="Eucalyptus" style="background: #33b679; color: #33b679;"></button>
                            <button type="button" class="color-opt" data-color="#009688" data-color-id="7" title="Teal" style="background: #009688; color: #009688;"></button>
                            <!-- Row 2 (12 colors) -->
                            <button type="button" class="color-opt" data-color="#039be5" data-color-id="7" title="Peacock" style="background: #039be5; color: #039be5;"></button>
                            <button type="button" class="color-opt" data-color="#4285f4" data-color-id="9" title="Blue" style="background: #4285f4; color: #4285f4;"></button>
                            <button type="button" class="color-opt" data-color="#3f51b5" data-color-id="9" title="Cobalt" style="background: #3f51b5; color: #3f51b5;"></button>
                            <button type="button" class="color-opt" data-color="#7986cb" data-color-id="1" title="Slate" style="background: #7986cb; color: #7986cb;"></button>
                            <button type="button" class="color-opt" data-color="#b39ddb" data-color-id="1" title="Lavender" style="background: #b39ddb; color: #b39ddb;"></button>
                            <button type="button" class="color-opt" data-color="#9e69af" data-color-id="3" title="Amethyst" style="background: #9e69af; color: #9e69af;"></button>
                            <button type="button" class="color-opt" data-color="#8e24aa" data-color-id="3" title="Grape" style="background: #8e24aa; color: #8e24aa;"></button>
                            <button type="button" class="color-opt" data-color="#d81b60" data-color-id="4" title="Raspberry" style="background: #d81b60; color: #d81b60;"></button>
                            <button type="button" class="color-opt" data-color="#ad1457" data-color-id="4" title="Berry" style="background: #ad1457; color: #ad1457;"></button>
                            <button type="button" class="color-opt" data-color="#795548" data-color-id="8" title="Cocoa" style="background: #795548; color: #795548;"></button>
                            <button type="button" class="color-opt" data-color="#a79b8e" data-color-id="8" title="Sand" style="background: #a79b8e; color: #a79b8e;"></button>
                            <button type="button" class="color-opt" data-color="#616161" data-color-id="8" title="Graphite" style="background: #616161; color: #616161;"></button>
                        </div>
                        <input type="hidden" id="selected-entry-color" value="default">
                    </div>
                </div>
                <div class="modal-actions" style="margin-top: 10px;">
                    <span class="hint">Esc to close</span>
                </div>
            </div>
        </div>

    </div>
    <script src="widget.js"></script>
</body>
</html>
